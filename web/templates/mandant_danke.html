<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank – FiBu-Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0A0F;
      color: rgba(255,255,255,0.92);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #111118;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: min(480px, 100%);
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .check {
      width: 56px; height: 56px;
      background: rgba(62,207,109,0.12);
      border: 1.5px solid rgba(62,207,109,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      color: #3ECF6D;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.6rem; }
    p { font-size: 0.88rem; color: rgba(255,255,255,0.55); line-height: 1.65; }
    .logo {
      margin-top: 2rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,107,53,0.5);
    }
  </style>
</head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>Vielen Dank!</h1>
  <p>Ihre Antwort wurde erfolgreich übermittelt.<br>Ihr Steuerberater wurde informiert und kann die Buchung nun weiterverarbeiten.</p>
  <div class="logo">FiBu-Agent · Fynaxa</div>
</div>
</body>
</html>
