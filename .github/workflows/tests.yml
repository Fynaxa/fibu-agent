name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      # Die Tests brauchen keinen API-Schluessel und kein Netz.
      - run: python -m pytest tests/ -q --ignore=tests/pilot_test.py --ignore=tests/generate_test_belege.py
